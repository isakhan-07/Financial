<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер доходов и расходов</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        body.light-theme {
            --bg-color: #f1f5f9;
            --panel-bg: rgba(255, 255, 255, 0.8);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-color: #0f172a;
            --text-muted: #64748b;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Auth Screen */
        .auth-container {
            width: 100%;
            max-width: 420px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--card-shadow);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: var(--primary);
            color: white;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .auth-toggle span {
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
            text-decoration: underline;
        }

        /* Main Dashboard (Hidden initially) */
        .app-container {
            display: none;
            width: 100%;
            max-width: 1100px;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin-top: 10px;
        }

        .stat-value.income { color: var(--success); }
        .stat-value.expense { color: var(--danger); }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .tx-list {
            list-style: none;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .tx-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .tx-actions button {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            margin-left: 10px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Экран Авторизации / Регистрации -->
    <div class="auth-container" id="authScreen">
        <div class="auth-header">
            <h2 id="authTitle">Вход в систему</h2>
            <p id="authSubtitle">Введите свои данные для доступа к трекеру</p>
        </div>

        <form id="authForm" data-mode="login">
            <div class="form-group">
                <label>Имя пользователя / Логин</label>
                <input type="text" id="authUsername" class="form-control" placeholder="user123" required>
            </div>
            
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="authPassword" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group hidden" id="confirmPasswordGroup">
                <label>Подтвердите пароль</label>
                <input type="password" id="authPasswordConfirm" class="form-control" placeholder="••••••••">
            </div>

            <button type="submit" class="btn" id="authSubmitBtn">Войти</button>
        </form>

        <div class="auth-toggle">
            <span id="toggleAuthMode">Нет аккаунта? Зарегистрироваться</span>
        </div>
    </div>

    <!-- Основной Дашборд -->
    <div class="app-container" id="appScreen">
        <div class="header">
            <div>
                <h2>Финансовый Дашборд</h2>
                <p style="color: var(--text-muted); font-size: 14px;">Валюта: UZS (сум)</p>
            </div>
            <div class="user-info">
                <span id="currentUserDisplay" style="font-weight: 600;">Пользователь</span>
                <button class="logout-btn" id="logoutBtn">Выйти</button>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3>Общий баланс</h3>
                <div class="stat-value" id="totalBalance">0 сум</div>
            </div>
            <div class="card">
                <h3>Доходы</h3>
                <div class="stat-value income" id="totalIncome">+0 сум</div>
            </div>
            <div class="card">
                <h3>Расходы</h3>
                <div class="stat-value expense" id="totalExpense">-0 сум</div>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3>Добавить транзакцию</h3>
                <form id="txForm" style="margin-top: 15px;">
                    <div class="form-group">
                        <label>Описание</label>
                        <input type="text" id="txTitle" class="form-control" placeholder="Например: Зарплата, Продукты" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Сумма (сум)</label>
                            <input type="number" id="txAmount" class="form-control" placeholder="50000" required min="1">
                        </div>
                        <div class="form-group">
                            <label>Тип</label>
                            <select id="txType" class="form-control">
                                <option value="income">Доход</option>
                                <option value="expense">Расход</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn">Сохранить</button>
                </form>
            </div>

            <div class="card">
                <h3>График доходов и расходов</h3>
                <div style="height: 220px; position: relative; margin-top: 15px;">
                    <canvas id="financeChart"></canvas>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>История транзакций</h3>
            <ul class="tx-list" id="txList"></ul>
        </div>
    </div>

    <script>
        // Инициализация переменных
        let currentUser = localStorage.getItem('active_user') || null;
        let chartInstance = null;

        const authScreen = document.getElementById('authScreen');
        const appScreen = document.getElementById('appScreen');
        const authForm = document.getElementById('authForm');
        const toggleAuthMode = document.getElementById('toggleAuthMode');
        const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');
        const authTitle = document.getElementById('authTitle');
        const authSubtitle = document.getElementById('authSubtitle');
        const authSubmitBtn = document.getElementById('authSubmitBtn');

        // Переключение режимов: Вход / Регистрация
        toggleAuthMode.addEventListener('click', () => {
            const isLogin = authForm.getAttribute('data-mode') === 'login';
            
            if (isLogin) {
                authForm.setAttribute('data-mode', 'register');
                authTitle.innerText = 'Регистрация';
                authSubtitle.innerText = 'Создайте новый аккаунт';
                authSubmitBtn.innerText = 'Зарегистрироваться';
                toggleAuthMode.innerText = 'Уже есть аккаунт? Войти';
                confirmPasswordGroup.classList.remove('hidden');
                document.getElementById('authPasswordConfirm').setAttribute('required', 'true');
            } else {
                authForm.setAttribute('data-mode', 'login');
                authTitle.innerText = 'Вход в систему';
                authSubtitle.innerText = 'Введите свои данные для доступа к трекеру';
                authSubmitBtn.innerText = 'Войти';
                toggleAuthMode.innerText = 'Нет аккаунта? Зарегистрироваться';
                confirmPasswordGroup.classList.add('hidden');
                document.getElementById('authPasswordConfirm').removeAttribute('required');
            }
        });

        // Обработка формы Входа / Регистрации
        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;
            const mode = authForm.getAttribute('data-mode');

            const users = JSON.parse(localStorage.getItem('registered_users') || '{}');

            if (mode === 'register') {
                const passwordConfirm = document.getElementById('authPasswordConfirm').value;
                if (password !== passwordConfirm) {
                    alert('Пароли не совпадают!');
                    return;
                }
                if (users[username]) {
                    alert('Пользователь с таким именем уже существует!');
                    return;
                }
                
                // Сохранение нового пользователя
                users[username] = password;
                localStorage.setItem('registered_users', JSON.stringify(users));
                localStorage.setItem(`tx_${username}`, JSON.stringify([]));
                alert('Регистрация прошла успешно! Теперь вы можете войти.');
                
                // Переключаем на вход
                toggleAuthMode.click();
            } else {
                // Логика входа
                if (!users[username] || users[username] !== password) {
                    alert('Неверное имя пользователя или пароль!');
                    return;
                }
                
                currentUser = username;
                localStorage.setItem('active_user', currentUser);
                initApp();
            }
        });

        // Выход из системы
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('active_user');
            currentUser = null;
            appScreen.style.display = 'none';
            authScreen.style.display = 'block';
            authForm.reset();
        });

        // Загрузка приложения после входа
        function initApp() {
            authScreen.style.display = 'none';
            appScreen.style.display = 'flex';
            document.getElementById('currentUserDisplay').innerText = currentUser;
            renderData();
        }

        // Получение и отрисовка данных
        function getUserTransactions() {
            return JSON.parse(localStorage.getItem(`tx_${currentUser}`) || '[]');
        }

        function saveUserTransactions(txs) {
            localStorage.setItem(`tx_${currentUser}`, JSON.stringify(txs));
        }

        function renderData() {
            const txs = getUserTransactions();
            let income = 0;
            let expense = 0;

            const listEl = document.getElementById('txList');
            listEl.innerHTML = '';

            txs.forEach((tx, index) => {
                if (tx.type === 'income') income += Number(tx.amount);
                else expense += Number(tx.amount);

                const li = document.createElement('li');
                li.className = 'tx-item';
                li.innerHTML = `
                    <div>
                        <strong>${tx.title}</strong>
                        <div style="font-size: 12px; color: var(--text-muted);">${tx.type === 'income' ? 'Доход' : 'Расход'}</div>
                    </div>
                    <div class="tx-actions">
                        <span style="color: ${tx.type === 'income' ? 'var(--success)' : 'var(--danger)'}; font-weight: 600;">
                            ${tx.type === 'income' ? '+' : '-'}${Number(tx.amount).toLocaleString('ru-RU')} сум
                        </span>
                        <button onclick="deleteTx(${index})">✕</button>
                    </div>
                `;
                listEl.appendChild(li);
            });

            document.getElementById('totalIncome').innerText = `+${income.toLocaleString('ru-RU')} сум`;
            document.getElementById('totalExpense').innerText = `-${expense.toLocaleString('ru-RU')} сум`;
            document.getElementById('totalBalance').innerText = `${(income - expense).toLocaleString('ru-RU')} сум`;

            updateChart(income, expense);
        }

        // Добавление транзакции
        document.getElementById('txForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('txTitle').value;
            const amount = document.getElementById('txAmount').value;
            const type = document.getElementById('txType').value;

            const txs = getUserTransactions();
            txs.unshift({ title, amount, type });
            saveUserTransactions(txs);

            document.getElementById('txForm').reset();
            renderData();
        });

        // Удаление транзакции
        window.deleteTx = function(index) {
            const txs = getUserTransactions();
            txs.splice(index, 1);
            saveUserTransactions(txs);
            renderData();
        };

        // Обновление графика Chart.js
        function updateChart(income, expense) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Доходы', 'Расходы'],
                    datasets: [{
                        data: [income, expense],
                        backgroundColor: ['#10b981', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#94a3b8' } }
                    }
                }
            });
        }

        // Проверка авторизации при старте
        if (currentUser) {
            initApp();
        }
    </script>
</body>
</html>
